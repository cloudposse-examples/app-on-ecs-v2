name: Feature Branch
on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, labeled]
  merge_group:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  statuses: write
  checks: write
  pull-requests: write
  security-events: write

env:
  ATMOS_PROFILE: github

jobs:
  test:
    needs: [ build ]
    runs-on: ["ubuntu-latest"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.mod
          
      - name: Run tests
        working-directory: app
        run: go test -v ./...

  build:
    runs-on: ["ubuntu-latest"]
    container:
      image: ghcr.io/cloudposse/atmos:${{ vars.ATMOS_VERSION }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Docker CLI
        run: apt-get update && apt-get install -y docker-cli bc awscli

      - name: Install Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: v0.36.1

      - name: Checkout
        uses: actions/checkout@v6

      - name: Atmos Cache
        uses: cloudposse/atmos/actions/cache@v1.226.0

      - name: AWS Auth
        run: |
          atmos auth env --identity plat-dev/terraform --format=github
          atmos auth login --identity plat-dev/terraform

      - name: Build and push
        run: |
          atmos app build \
            --registry "${{ vars.ECR_REGISTRY }}" \
            --image "${{ vars.ECR_REGISTRY }}/cloudposse-examples/atmos-native-ci:sha-${{ github.sha }}" \
            --image-cache "${{ vars.ECR_REGISTRY }}/cloudposse-examples/atmos-native-ci:buildcache"
          atmos app push \
            --registry "${{ vars.ECR_REGISTRY }}" \
            --image "${{ vars.ECR_REGISTRY }}/cloudposse-examples/atmos-native-ci:sha-${{ github.sha }}" \
            --stack "${{ github.event_name == 'pull_request' && 'preview' || 'dev' }}" \
            --store-key "${{ github.event_name == 'pull_request' && format('image-{0}', github.event.pull_request.number) || 'image' }}"

  e2e:
    runs-on: ["ubuntu-latest"]
    name: e2e
    container:
      image: ghcr.io/cloudposse/atmos:${{ vars.ATMOS_VERSION }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Docker CLI
        run: apt-get update && apt-get install -y docker-cli

      - name: Checkout
        uses: actions/checkout@v6

      - name: Atmos Cache
        uses: cloudposse/atmos/actions/cache@v1.226.0

      - name: Run ECS component tests against AWS emulator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          atmos terraform test app -s fixtures --ci

  deploy-preview:
    needs: [ test, build, e2e ]
    runs-on: ["ubuntu-latest"]
    container:
      image: ghcr.io/cloudposse/atmos:${{ vars.ATMOS_VERSION }}
    name: deploy / preview
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'deploy')
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.output_url }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Atmos Cache
        uses: cloudposse/atmos/actions/cache@v1.226.0

      - name: Deploy ECS Service
        id: deploy
        env:
          ATMOS_PROFILE: github
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          atmos terraform deploy app -s preview

  deploy-dev:
    needs: [ test, build, e2e ]
    runs-on: ["ubuntu-latest"]
    container:
      image: ghcr.io/cloudposse/atmos:${{ vars.ATMOS_VERSION }}
    name: deploy / dev
    if: github.event_name == 'merge_group'
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.output_url }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Atmos Cache
        uses: cloudposse/atmos/actions/cache@v1.226.0

      - name: Deploy ECS Service
        id: deploy
        env:
          ATMOS_PROFILE: github
        run: |
          atmos terraform deploy app -s dev
