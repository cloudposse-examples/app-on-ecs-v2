# Custom Atmos commands for local development
# Usage: atmos up, atmos down, atmos test

commands:
  - name: build
    description: Build the application image with the shared ECR Buildx cache
    working_directory: !repo-root
    steps:
      - name: build
        type: container
        action: build
        provider: docker
        with:
          engine: buildx
          context: app
          dockerfile: app/Dockerfile
          tags:
            - "{{ .env.APP_IMAGE }}"
          driver:
            name: atmos-native-ci
            provider: docker-container
            opts:
              image: mirror.gcr.io/moby/buildkit:buildx-stable-1
          cache:
            from:
              - type: registry
                ref: "{{ .env.APP_IMAGE_CACHE }}"
            to:
              - type: registry
                ref: "{{ .env.APP_IMAGE_CACHE }}"
                mode: max

  - name: push
    description: Authenticate to ECR and push the application image
    working_directory: !repo-root
    steps:
      - name: authenticate to ECR
        type: shell
        command: atmos aws ecr login --registry "{{ .env.ECR_REGISTRY }}"
      - name: push
        type: container
        action: push
        provider: docker
        with:
          image: "{{ .env.APP_IMAGE }}"

  - name: up
    description: Start the application locally using Atmos native containers
    steps:
      - echo "Starting app at http://localhost:8080 (dashboard at http://localhost:8080/dashboard)"
      - atmos container up app -s local

  - name: down
    description: Stop the local Atmos native container application
    steps:
      - atmos container down app -s local

  - name: logs
    description: Stream local application container logs
    steps:
      - atmos container logs app -s local

  - name: test
    description: Run Go tests
    working_directory: app
    steps:
      - go test -v ./...
