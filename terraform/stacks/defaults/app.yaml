components:
  terraform:
    app:
      metadata:
        component: ecs-task
        terraform_workspace: "atmos-native-ci-{{ .atmos_stack }}-{{ .atmos_component }}"
      secrets:
        vars:
          API_KEY:
            description: "Example application API key injected into ECS from SSM Parameter Store."
            store: secrets/ssm
            required: true
      hooks:
        fmt:
          events:
            - before.terraform.init
            - before.terraform.plan
          kind: command
          command: sh
          args:
            - -ec
            - tofu fmt -check -recursive "$ATMOS_COMPONENT_PATH"
          on_failure: fail
        trivy:
          events:
            - after.terraform.plan
          kind: trivy
          on_failure: fail
        tflint:
          events:
            - before.terraform.plan
            - before.terraform.test
          kind: command
          command: sh
          args:
            - -ec
            - tflint --chdir "$ATMOS_COMPONENT_PATH" --init && tflint --chdir "$ATMOS_COMPONENT_PATH"
          on_failure: fail
      vars:
        name: app
        ecs: !terraform.state ecs/cluster .
        vpc: !terraform.state vpc .
        lb: !terraform.state ecs/cluster .alb.public
        base_domains: !terraform.state ecs/cluster .records
        containers:
          app:
            image: !store image-metadata {{ .atmos_stack }} app image-{{ env "PR_NUMBER" | default .vars.stage }}
            memory: 256
            portMappings:
              - containerPort: 8080
            environment:
              - name: COLOR
                value: green
            secrets:
              - name: API_KEY
                valueFrom: "/atmos/app-on-ecs-v2/secrets/{{ .atmos_stack }}/{{ .atmos_component }}/API_KEY"
            healthCheck:
              command: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
              interval: 5
              retries: 3
              startPeriod: 5
              timeout: 3
            logConfiguration:
                logDriver: "awslogs"
                options:
                    awslogs-create-group: true
                    awslogs-group: "app"
                    awslogs-region: "us-east-2"
                    awslogs-stream-prefix: "app"
        url_path: /dashboard
        autoscaling:
          min_capacity: 2
          max_capacity: 4
          scale_up_cooldown: 30
          scale_down_cooldown: 60
          rule:
            high:
              threshold: 30
              period: 60
            low:
              threshold: 10
              period: 60
