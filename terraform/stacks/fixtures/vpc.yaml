components:
  terraform:
    vpc:
      metadata:
        terraform_workspace: default
      source:
        uri: github.com/cloudposse-terraform-components/aws-vpc.git//src
        version: v2.3.0
        included_paths:
          - "*.tf"
        excluded_paths:
          - "*.md"
          - "remote-state.tf"
          - "versions.tf"
          - "vpc-flow-logs.tf"
      generate:
        "providers.tf": |
          provider "aws" {
            region = "{{ .vars.region }}"
          }
        "main.tf": |
          locals {
            availability_zones = length(var.availability_zones) > 0 ? (
              (substr(
                var.availability_zones[0],
                0,
                length(var.region)
              ) == var.region) ? var.availability_zones : formatlist("${var.region}%s", var.availability_zones)
            ) : formatlist("${var.region}%s", slice(["a", "b"], 0, var.max_subnet_count))

            private_cidrs = try(var.ipv4_cidrs[0].private, [])
            public_cidrs  = try(var.ipv4_cidrs[0].public, [])
          }

          resource "aws_vpc" "default" {
            cidr_block           = var.ipv4_primary_cidr_block
            enable_dns_hostnames = true
            enable_dns_support   = true

            tags = merge(module.this.tags, {
              Name = module.this.id
            })
          }

          resource "aws_subnet" "private" {
            count = length(local.private_cidrs)

            vpc_id            = aws_vpc.default.id
            cidr_block        = local.private_cidrs[count.index]
            availability_zone = local.availability_zones[count.index]

            tags = merge(module.this.tags, {
              Name                  = "${module.this.id}-private-${local.availability_zones[count.index]}"
              (var.subnet_type_tag_key) = "private"
            })
          }

          resource "aws_subnet" "public" {
            count = var.public_subnets_enabled ? length(local.public_cidrs) : 0

            vpc_id                  = aws_vpc.default.id
            cidr_block              = local.public_cidrs[count.index]
            availability_zone       = local.availability_zones[count.index]
            map_public_ip_on_launch = var.map_public_ip_on_launch

            tags = merge(module.this.tags, {
              Name                  = "${module.this.id}-public-${local.availability_zones[count.index]}"
              (var.subnet_type_tag_key) = "public"
            })
          }
        "outputs.tf": |
          output "public_subnet_ids" {
            value       = aws_subnet.public[*].id
            description = "Public subnet IDs."
          }

          output "private_subnet_ids" {
            value       = aws_subnet.private[*].id
            description = "Private subnet IDs."
          }

          output "availability_zones" {
            value       = local.availability_zones
            description = "Availability zones used by the fixture VPC."
          }

          output "vpc_cidr" {
            value       = aws_vpc.default.cidr_block
            description = "VPC CIDR block."
          }

          output "vpc_id" {
            value       = aws_vpc.default.id
            description = "VPC ID."
          }
        "versions.tf": |
          terraform {
            required_version = ">= 1.0.0"

            required_providers {
              aws = {
                source  = "hashicorp/aws"
                version = ">= 4.9.0, < 6.0.0"
              }
            }
          }
      provision:
        workdir:
          enabled: true
      vars:
        name: vpc
        availability_zones:
          - a
          - b
        ipv4_primary_cidr_block: 10.64.0.0/16
        ipv4_cidrs:
          - private:
              - 10.64.0.0/24
              - 10.64.1.0/24
            public:
              - 10.64.100.0/24
              - 10.64.101.0/24
        max_subnet_count: 2
        nat_gateway_enabled: false
        public_subnets_enabled: true
        subnet_type_tag_key: cpco/subnet/type
        vpc_flow_logs_enabled: false
