import:
  - _default.yaml
  - "git::https://github.com/cloudposse/infra-live.git//stacks/mixins/account-map.yaml?ref=209880bab85ead2d9b5f5e07b648e05122d42907"

vars:
  stage: fixtures
  deps_stage: fixtures
  region: us-east-2

terraform:
  backend_type: local
  backend:
    local:
      path: '../../../.context/tfstate/{{ .atmos_stack }}-{{ .atmos_component | regexp.ReplaceLiteral "\\W" "-" }}.tfstate'
  auth:
    identities:
      local-aws:
        default: true

auth:
  identities:
    local-aws:
      kind: aws/emulator
      emulator: aws
      default: true

components:
  emulator:
    aws:
      driver: floci/aws
      region: "{{ .vars.region }}"
      ephemeral: true

  terraform:
    vpc:
      metadata:
        terraform_workspace: default
      source:
        uri: github.com/cloudposse/terraform-aws-components.git//modules/vpc
        version: 1.99.0
        included_paths:
          - "*.tf"
        excluded_paths:
          - "*.md"
          - "versions.tf"
          - "vpc-flow-logs.tf"
      generate:
        "providers.tf": |
          provider "aws" {
            region = "{{ .vars.region }}"
          }
        "main.tf": |
          locals {
            availability_zones = length(var.availability_zones) > 0 ? (
              (substr(
                var.availability_zones[0],
                0,
                length(var.region)
              ) == var.region) ? var.availability_zones : formatlist("${var.region}%s", var.availability_zones)
            ) : formatlist("${var.region}%s", slice(["a", "b"], 0, var.max_subnet_count))

            private_cidrs = try(var.ipv4_cidrs[0].private, [])
            public_cidrs  = try(var.ipv4_cidrs[0].public, [])
          }

          resource "aws_vpc" "default" {
            cidr_block           = var.ipv4_primary_cidr_block
            enable_dns_hostnames = true
            enable_dns_support   = true

            tags = merge(module.this.tags, {
              Name = module.this.id
            })
          }

          resource "aws_subnet" "private" {
            count = length(local.private_cidrs)

            vpc_id            = aws_vpc.default.id
            cidr_block        = local.private_cidrs[count.index]
            availability_zone = local.availability_zones[count.index]

            tags = merge(module.this.tags, {
              Name                  = "${module.this.id}-private-${local.availability_zones[count.index]}"
              (var.subnet_type_tag_key) = "private"
            })
          }

          resource "aws_subnet" "public" {
            count = var.public_subnets_enabled ? length(local.public_cidrs) : 0

            vpc_id                  = aws_vpc.default.id
            cidr_block              = local.public_cidrs[count.index]
            availability_zone       = local.availability_zones[count.index]
            map_public_ip_on_launch = var.map_public_ip_on_launch

            tags = merge(module.this.tags, {
              Name                  = "${module.this.id}-public-${local.availability_zones[count.index]}"
              (var.subnet_type_tag_key) = "public"
            })
          }
        "outputs.tf": |
          output "public_subnet_ids" {
            value       = aws_subnet.public[*].id
            description = "Public subnet IDs."
          }

          output "private_subnet_ids" {
            value       = aws_subnet.private[*].id
            description = "Private subnet IDs."
          }

          output "availability_zones" {
            value       = local.availability_zones
            description = "Availability zones used by the fixture VPC."
          }

          output "vpc_cidr" {
            value       = aws_vpc.default.cidr_block
            description = "VPC CIDR block."
          }

          output "vpc_id" {
            value       = aws_vpc.default.id
            description = "VPC ID."
          }
        "versions.tf": |
          terraform {
            required_version = ">= 1.0.0"

            required_providers {
              aws = {
                source  = "hashicorp/aws"
                version = ">= 4.9.0, < 6.0.0"
              }
            }
          }
      provision:
        workdir:
          enabled: true
      vars:
        name: vpc
        availability_zones:
          - a
          - b
        ipv4_primary_cidr_block: 10.64.0.0/16
        ipv4_cidrs:
          - private:
              - 10.64.0.0/24
              - 10.64.1.0/24
            public:
              - 10.64.100.0/24
              - 10.64.101.0/24
        max_subnet_count: 2
        nat_gateway_enabled: false
        public_subnets_enabled: true
        subnet_type_tag_key: cpco/subnet/type
        vpc_flow_logs_enabled: false

    ecs/cluster:
      metadata:
        terraform_workspace: default
      source:
        uri: github.com/cloudposse/terraform-aws-ecs-cluster.git
        version: v2.0.1
        included_paths:
          - "*.tf"
        excluded_paths:
          - "*.md"
      generate:
        "providers.tf": |
          provider "aws" {
            region = "{{ .vars.region }}"
          }
        "ec2.tf": |
          locals {
            ec2_capacity_providers          = {}
            external_ec2_capacity_providers = {}
          }

          resource "aws_ecs_capacity_provider" "ec2" {
            for_each = local.ec2_capacity_providers

            name = each.key

            auto_scaling_group_provider {
              auto_scaling_group_arn         = ""
              managed_termination_protection = "DISABLED"
            }
          }

          resource "aws_ecs_capacity_provider" "external_ec2" {
            for_each = local.external_ec2_capacity_providers

            name = each.key

            auto_scaling_group_provider {
              auto_scaling_group_arn         = ""
              managed_termination_protection = "DISABLED"
            }
          }
        "iam.tf": |
          # The emulator fixture does not need EC2 capacity provider IAM wiring.
        "outputs.tf": |
          output "name" {
            description = "ECS cluster name"
            value       = module.this.enabled ? local.cluster_name : null
          }

          output "id" {
            description = "ECS cluster id"
            value       = module.this.enabled ? join("", aws_ecs_cluster.default[*].id) : null
          }

          output "arn" {
            description = "ECS cluster arn"
            value       = module.this.enabled ? join("", aws_ecs_cluster.default[*].arn) : null
          }

          output "role_name" {
            description = "IAM role name"
            value       = null
          }
      provision:
        workdir:
          enabled: true
      vars:
        name: ecs
        container_insights_mode: disabled
        capacity_providers_fargate: false
        default_capacity_strategy:
          base:
            provider: FARGATE
            value: 0
          weights: {}

    app:
      metadata:
        component: ecs-task
        terraform_workspace: default
      hooks:
        fixtures-up:
          events:
            - before.terraform.test
          kind: steps
          on_failure: fail
          with:
            - type: shell
              command: |
                mkdir -p .context/tfstate
                rm -f .context/tfstate/fixtures-*.tfstate*
                rm -rf terraform/components/vpc/terraform.tfstate.d terraform/components/ecs/cluster/terraform.tfstate.d terraform/components/ecs-task/terraform.tfstate.d
            - type: emulator
              component: aws
              action: up
              ephemeral: true
            - type: atmos
              command: terraform source pull vpc -s fixtures --force
            - type: atmos
              command: terraform source pull ecs/cluster -s fixtures --force
            - type: atmos
              command: terraform apply vpc -s fixtures -auto-approve
            - type: atmos
              command: terraform apply ecs/cluster -s fixtures -auto-approve
            - type: shell
              command: |
                vpc_outputs="$(atmos terraform output vpc -s fixtures --format json)"
                ecs_outputs="$(atmos terraform output ecs/cluster -s fixtures --format json)"

                jq -n \
                  --argjson vpc "$vpc_outputs" \
                  --argjson ecs "$ecs_outputs" \
                  '{
                    ecs: {
                      cluster_arn: $ecs.arn,
                      cluster_name: $ecs.name
                    },
                    vpc: {
                      availability_zones: $vpc.availability_zones,
                      az_private_subnets_map: (
                        $vpc.availability_zones as $azs |
                        $vpc.private_subnet_ids as $ids |
                        reduce range(0; ($azs | length)) as $i ({}; .[$azs[$i]] = [$ids[$i]])
                      ),
                      az_public_subnets_map: (
                        $vpc.availability_zones as $azs |
                        $vpc.public_subnet_ids as $ids |
                        reduce range(0; ($azs | length)) as $i ({}; .[$azs[$i]] = [$ids[$i]])
                      ),
                      flow_log_destination: null,
                      flow_log_id: [],
                      private_subnet_ids: $vpc.private_subnet_ids,
                      public_subnet_ids: $vpc.public_subnet_ids,
                      vpc_cidr: $vpc.vpc_cidr,
                      vpc_id: $vpc.vpc_id
                    }
                  }' > terraform/components/ecs-task/fixtures.auto.tfvars.json
        fixtures-down:
          events:
            - after.terraform.test
          kind: steps
          when: always
          on_failure: warn
          with:
            - type: atmos
              command: terraform destroy ecs/cluster -s fixtures -auto-approve
            - type: atmos
              command: terraform destroy vpc -s fixtures -auto-approve
            - type: emulator
              component: aws
              action: down
            - type: shell
              command: rm -f terraform/components/ecs-task/fixtures.auto.tfvars.json
      generate:
        "providers.tf": |
          provider "aws" {
            region = var.region
          }
      vars:
        name: app
        containers:
          app:
            image: public.ecr.aws/docker/library/nginx:alpine
            memory: 256
            portMappings:
              - containerPort: 80
            environment:
              - name: COLOR
                value: blue
        url_path: /dashboard
        service:
          capacity_provider_strategy_enabled: false
          load_balancer_enabled: false
          wait_for_steady_state: false
        autoscaling:
          enabled: false
        task_policy_arns: []
        base_domains:
          public: "*.local.test"
          private: "*.local.test"
